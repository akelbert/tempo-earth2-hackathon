# Build the Earth-2 Lab image on Cloud Build.
#
# The base image is large and the dependency resolution is slow; building on a
# high-CPU machine with a persistent disk beats building on a laptop, and it
# produces an amd64 image without emulation.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_RELEASE=rc1 .
#
# Note the machine type and timeout: a cold build of this image takes well over
# the 10-minute default.

substitutions:
  _REGION: us-central1
  _REPOSITORY: earth2
  _IMAGE: earth2-lab
  _HUB_IMAGE: earth2-hub
  _RELEASE: dev
  _E2S_VERSION: "0.17.0"
  _PREFETCH_MODEL: "true"
  _PREFETCH_MODELS: FCN,DLWP,PrecipitationAFNO
  _EARTH2STUDIO_EXTRAS: fcn,dlwp,precip-afno,data,utils
  _EARTH2STUDIO_IMPORT_CHECK: 'from earth2studio.models.px import FCN, DLWP; from earth2studio.models.dx import PrecipitationAFNO'

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 500
  logging: CLOUD_LOGGING_ONLY

timeout: 5400s

steps:
  - id: build-lab
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --build-arg=EARTH2STUDIO_VERSION=${_E2S_VERSION}
      - --build-arg=EARTH2STUDIO_EXTRAS=${_EARTH2STUDIO_EXTRAS}
      - --build-arg=EARTH2STUDIO_IMPORT_CHECK=${_EARTH2STUDIO_IMPORT_CHECK}
      - --build-arg=PREFETCH_MODEL=${_PREFETCH_MODEL}
      - --build-arg=PREFETCH_MODELS=${_PREFETCH_MODELS}
      - -f=docker/Dockerfile
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_RELEASE}
      - .

  - id: build-hub
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - -f=docker/Dockerfile.hub
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_HUB_IMAGE}:${_RELEASE}
      - .

  # Push during the build so the following steps can resolve registry manifest
  # digests. The top-level `images` mechanism pushes only after all steps.
  - id: push-lab
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_RELEASE}"]

  - id: push-hub
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_HUB_IMAGE}:${_RELEASE}"]

  - id: record-lab-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts docker images describe \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_RELEASE} \
          --format='value(image_summary.fully_qualified_digest)' \
          | tee /workspace/lab-image-reference.txt

  - id: record-hub-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts docker images describe \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_HUB_IMAGE}:${_RELEASE} \
          --format='value(image_summary.fully_qualified_digest)' \
          | tee /workspace/hub-image-reference.txt
