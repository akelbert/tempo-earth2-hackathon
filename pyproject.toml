[project]
name = "tempo-earth2"
version = "0.1.0"
description = "Workshop helpers for NASA TEMPO with NVIDIA Earth2Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5netcdf>=1.8.1",
    "matplotlib>=3.11.1",
    "netcdf4>=1.6.4,<1.7.3",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "xarray>=2026.7.0",
    "zarr>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
maps = [
    "cartopy>=0.25.0",
]
staging = [
    "earthaccess>=0.18.0",
    "fsspec>=2026.7.0",
    "gcsfs>=2026.8.0",
]
